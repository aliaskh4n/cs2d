name: Publish CS2d Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - name: Check app and companion types
        run: |
          pnpm --filter cs2-demo-viewer type-check
          pnpm --filter cs2-demo-viewer-extension type-check
      - run: pnpm test
      - name: Build companion
        run: pnpm --filter cs2-demo-viewer-extension build
      - name: Package companion
        run: cd apps/extension/.output/chrome-mv3 && zip -qr ../../../app/public/cs2d-companion.zip .
      - name: Build Pages site
        run: pnpm --filter cs2-demo-viewer build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
